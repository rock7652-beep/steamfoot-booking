name: PR3A minimize UI diff

on:
  pull_request:
    branches:
      - main
    types: [reopened]

permissions:
  contents: write

jobs:
  minimize-and-validate:
    if: github.head_ref == 'codex/pr3a-per-store-referral-share-template-core'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/steamfoot
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/steamfoot
      AUTH_SECRET: pr3a-test-secret
      NEXTAUTH_SECRET: pr3a-test-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore existing UI files and reapply minimal wiring
        shell: bash
        run: |
          for path in \
            'src/components/share-referral.tsx' \
            'src/app/(customer)/book/share-contact-actions.tsx' \
            'src/app/(customer)/book/page.tsx' \
            'src/app/(customer)/book/booking-form.tsx' \
            'src/app/(customer)/my-referrals/page.tsx'; do
            git show "origin/main:$path" > "$path"
          done

          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'expected snippet not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/components/share-referral.tsx',
              '  referralUrl: string;\n  /** 完整模式顯示連結文字 + 統計；精簡模式只顯示按鈕 */',
              '  referralUrl: string;\n  /** Server 已驗證並解析 fallback 的每店推薦分享模板 */\n  shareTemplate?: string | null;\n  /** 完整模式顯示連結文字 + 統計；精簡模式只顯示按鈕 */',
          )
          replace_once(
              'src/components/share-referral.tsx',
              '  referralUrl,\n  variant = "compact",',
              '  referralUrl,\n  shareTemplate,\n  variant = "compact",',
          )
          replace_once(
              'src/components/share-referral.tsx',
              '  const shareText = buildShareText({ storeName, inviterName, url: absoluteUrl });',
              '  const shareText = buildShareText({\n    storeName,\n    inviterName,\n    url: absoluteUrl,\n    template: shareTemplate,\n  });',
          )

          replace_once(
              'src/app/(customer)/book/share-contact-actions.tsx',
              '  referralUrl: string;\n  /** @deprecated PR 2 起不送入 action；保留 prop 相容，待後續清理。 */',
              '  referralUrl: string;\n  /** Server 已驗證並解析 fallback 的每店推薦分享模板 */\n  shareTemplate?: string | null;\n  /** @deprecated PR 2 起不送入 action；保留 prop 相容，待後續清理。 */',
          )
          replace_once(
              'src/app/(customer)/book/share-contact-actions.tsx',
              '  referralUrl,\n}: Props) {',
              '  referralUrl,\n  shareTemplate,\n}: Props) {',
          )
          replace_once(
              'src/app/(customer)/book/share-contact-actions.tsx',
              '  const shareText = buildShareText({ storeName, url: absoluteUrl });',
              '  const shareText = buildShareText({\n    storeName,\n    url: absoluteUrl,\n    template: shareTemplate,\n  });',
          )

          replace_once(
              'src/app/(customer)/my-referrals/page.tsx',
              '                referralUrl={shareContext.referralUrl}\n                variant="compact"',
              '                referralUrl={shareContext.referralUrl}\n                shareTemplate={shareContext.shareTemplate}\n                variant="compact"',
          )
          replace_once(
              'src/app/(customer)/book/page.tsx',
              '                referralUrl={shareContext.referralUrl}\n                storeId={storeId ?? undefined}',
              '                referralUrl={shareContext.referralUrl}\n                shareTemplate={shareContext.shareTemplate}\n                storeId={storeId ?? undefined}',
          )

          replace_once(
              'src/app/(customer)/book/booking-form.tsx',
              '  referralUrl: string;\n  customerId: string;',
              '  referralUrl: string;\n  shareTemplate?: string | null;\n  customerId: string;',
          )
          replace_once(
              'src/app/(customer)/book/booking-form.tsx',
              'export function BookingForm({ customerId, selectedDate, slots, activeWallets, storeId, storeName, referralUrl }: Props) {',
              'export function BookingForm({ customerId, selectedDate, slots, activeWallets, storeId, storeName, referralUrl, shareTemplate }: Props) {',
          )
          replace_once(
              'src/app/(customer)/book/booking-form.tsx',
              '                referralUrl={referralUrl}\n                variant="compact"',
              '                referralUrl={referralUrl}\n                shareTemplate={shareTemplate}\n                variant="compact"',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate minimized tree
        run: |
          npx prisma validate
          npx vitest run src/__tests__/share-per-store.test.ts src/__tests__/referral-share-context.test.ts src/__tests__/referral-share-template-action.test.ts
          npx eslint src/lib/share.ts src/server/queries/referral-share-context.ts src/server/actions/referral-share-template.ts src/components/share-referral.tsx 'src/app/(customer)/book/share-contact-actions.tsx' 'src/app/(customer)/book/page.tsx' 'src/app/(customer)/book/booking-form.tsx' 'src/app/(customer)/my-referrals/page.tsx' src/__tests__/share-per-store.test.ts src/__tests__/referral-share-context.test.ts src/__tests__/referral-share-template-action.test.ts
          git diff --check
          npm run build

      - name: Commit minimized UI wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'src/components/share-referral.tsx' \
            'src/app/(customer)/book/share-contact-actions.tsx' \
            'src/app/(customer)/book/page.tsx' \
            'src/app/(customer)/book/booking-form.tsx' \
            'src/app/(customer)/my-referrals/page.tsx'
          git commit -m "Minimize PR 3-A share template wiring diff"
          git push origin HEAD:${{ github.head_ref }}
