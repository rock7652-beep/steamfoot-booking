name: One-time HealthFlow fingerprint recovery - Deng Feiting retry

on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-healthflow-fingerprint-recovery-deng-feiting-retry.yml]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      HEALTHFLOW_SUPABASE_URL: ${{ secrets.HEALTHFLOW_SUPABASE_URL }}
      HEALTHFLOW_SERVICE_ROLE_KEY: ${{ secrets.HEALTHFLOW_SERVICE_ROLE_KEY }}
      CUSTOMER_ID: cmspmp9es0001l304a66vxlnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: Read-only fingerprint audit with bounded retry
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if npx tsx scripts/recover-healthflow-history-by-fingerprint.ts; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then sleep 10; fi
          done
          exit 1
      - name: Recover unique fingerprint match with bounded retry
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if npx tsx scripts/recover-healthflow-history-by-fingerprint.ts --execute; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then sleep 10; fi
          done
          exit 1
