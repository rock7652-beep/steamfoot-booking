name: One-time repair expired booking wallets

on:
  push:
    branches: [main]
    paths: [.github/repair-expired-booking-wallets-request.json]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: Enforce repair scope
        run: |
          ! grep -En '\.(delete|deleteMany|create|createMany|upsert|executeRaw|queryRaw)\(' scripts/repair-future-bookings-after-wallet-expiry.ts
          test "$(grep -Ec 'tx\.booking\.update\(' scripts/repair-future-bookings-after-wallet-expiry.ts)" -eq 1
      - run: npx tsx scripts/repair-future-bookings-after-wallet-expiry.ts --execute --owner-authorized
      - uses: actions/upload-artifact@v4
        with:
          name: private-expired-booking-wallet-repair-result
          path: expired-booking-wallet-repair-result.json
          retention-days: 1
