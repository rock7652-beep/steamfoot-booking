name: One-time Jian LIFF first capture
on:
  push:
    branches: [main]
    paths: [.github/jian-liff-first-capture-request.json]
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx scripts/one-time-jian-liff-first-capture.ts
      - uses: actions/upload-artifact@v4
        with:
          name: jian-liff-first-capture-result
          path: jian-liff-first-capture-result.json
          retention-days: 1
