name: PR3A referral template artifact

on:
  pull_request:
    branches:
      - main
    types: [reopened]

permissions:
  contents: read

jobs:
  build-artifact:
    if: github.head_ref == 'codex/pr3a-per-store-referral-share-template-core'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/steamfoot
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/steamfoot
      AUTH_SECRET: pr3a-test-secret
      NEXTAUTH_SECRET: pr3a-test-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract and apply implementation script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/pr3a-referral-template-implementation.yml').read_text()
          start_marker = '      - name: Apply PR 3-A changes\n        shell: bash\n        run: |\n'
          end_marker = '\n      - name: Install dependencies\n'
          block = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-pr3a.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-pr3a.sh

      - name: Install dependencies
        run: npm ci

      - name: Validate implementation
        run: |
          npx prisma format
          npx prisma validate
          npx vitest run src/__tests__/share-per-store.test.ts src/__tests__/referral-share-context.test.ts src/__tests__/referral-share-template-action.test.ts
          npx eslint src/lib/share.ts src/server/queries/referral-share-context.ts src/server/actions/referral-share-template.ts src/components/share-referral.tsx 'src/app/(customer)/book/share-contact-actions.tsx' 'src/app/(customer)/book/page.tsx' 'src/app/(customer)/book/booking-form.tsx' 'src/app/(customer)/my-referrals/page.tsx' src/__tests__/share-per-store.test.ts src/__tests__/referral-share-context.test.ts src/__tests__/referral-share-template-action.test.ts
          git diff --check
          npm run build

      - name: Stage artifact tree
        shell: bash
        run: |
          mkdir -p /tmp/pr3a-artifact
          while IFS= read -r path; do
            mkdir -p "/tmp/pr3a-artifact/$(dirname "$path")"
            cp "$path" "/tmp/pr3a-artifact/$path"
          done <<'EOF'
          prisma/schema.prisma
          prisma/migrations/20260714_add_referral_share_template/migration.sql
          src/lib/share.ts
          src/server/queries/referral-share-context.ts
          src/server/actions/referral-share-template.ts
          src/components/share-referral.tsx
          src/app/(customer)/book/share-contact-actions.tsx
          src/app/(customer)/book/page.tsx
          src/app/(customer)/book/booking-form.tsx
          src/app/(customer)/my-referrals/page.tsx
          src/__tests__/share-per-store.test.ts
          src/__tests__/referral-share-context.test.ts
          src/__tests__/referral-share-template-action.test.ts
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: pr3a-patched-source
          path: /tmp/pr3a-artifact
          if-no-files-found: error
          retention-days: 1
