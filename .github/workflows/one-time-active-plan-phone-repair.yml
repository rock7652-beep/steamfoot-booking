name: One-time active-plan phone identity repair
on:
  push:
    branches: [main]
    paths: [.github/active-plan-phone-repair-request.json]
permissions: {contents: read}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production – steamfoot-booking
    env: {DATABASE_URL: "${{ secrets.DATABASE_URL }}", DIRECT_URL: "${{ secrets.DIRECT_URL }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx scripts/repair-active-plan-phone-identities.ts
