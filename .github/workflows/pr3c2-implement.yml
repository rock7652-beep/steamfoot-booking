name: PR 3-C2 implementation

on:
  push:
    branches:
      - codex/pr3c2-referral-template-favorites-usage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr3c2-referral-template-favorites-usage
      - name: Add schema migration backend and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('prisma/schema.prisma')
          text = schema.read_text()
          if 'enum ReferralShareTemplateUsageAction' not in text:
              marker = 'enum ReferralEventType {\n'
              enum_block = '''enum ReferralShareTemplateUsageAction {\n  PREVIEW\n  APPLY\n  SAVE\n}\n\n'''
              text = text.replace(marker, enum_block + marker)

          if 'model ReferralShareTemplateFavorite' not in text:
              models = '''\nmodel ReferralShareTemplateFavorite {\n  id         String   @id @default(cuid())\n  storeId    String\n  templateId String\n  createdAt  DateTime @default(now())\n  updatedAt  DateTime @updatedAt\n\n  store Store @relation(fields: [storeId], references: [id], onDelete: Cascade)\n\n  @@unique([storeId, templateId])\n  @@index([storeId, updatedAt])\n}\n\nmodel ReferralShareTemplateUsage {\n  id         String                           @id @default(cuid())\n  storeId    String\n  templateId String\n  action     ReferralShareTemplateUsageAction\n  createdAt  DateTime                         @default(now())\n\n  store Store @relation(fields: [storeId], references: [id], onDelete: Cascade)\n\n  @@index([storeId, createdAt])\n  @@index([storeId, templateId, action, createdAt])\n}\n'''
              text += models

          if 'referralShareTemplateFavorites' not in text:
              start = text.index('model Store {')
              i = start
              depth = 0
              close = None
              while i < len(text):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          close = i
                          break
                  i += 1
              rels = '  referralShareTemplateFavorites ReferralShareTemplateFavorite[]\n  referralShareTemplateUsages    ReferralShareTemplateUsage[]\n'
              text = text[:close] + rels + text[close:]
          schema.write_text(text)

          migration = Path('prisma/migrations/20260715_add_referral_template_favorites_usage/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''CREATE TYPE "ReferralShareTemplateUsageAction" AS ENUM ('PREVIEW', 'APPLY', 'SAVE');\n\nCREATE TABLE "ReferralShareTemplateFavorite" (\n  "id" TEXT NOT NULL,\n  "storeId" TEXT NOT NULL,\n  "templateId" TEXT NOT NULL,\n  "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  "updatedAt" TIMESTAMP(3) NOT NULL,\n  CONSTRAINT "ReferralShareTemplateFavorite_pkey" PRIMARY KEY ("id")\n);\n\nCREATE TABLE "ReferralShareTemplateUsage" (\n  "id" TEXT NOT NULL,\n  "storeId" TEXT NOT NULL,\n  "templateId" TEXT NOT NULL,\n  "action" "ReferralShareTemplateUsageAction" NOT NULL,\n  "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  CONSTRAINT "ReferralShareTemplateUsage_pkey" PRIMARY KEY ("id")\n);\n\nCREATE UNIQUE INDEX "ReferralShareTemplateFavorite_storeId_templateId_key" ON "ReferralShareTemplateFavorite"("storeId", "templateId");\nCREATE INDEX "ReferralShareTemplateFavorite_storeId_updatedAt_idx" ON "ReferralShareTemplateFavorite"("storeId", "updatedAt");\nCREATE INDEX "ReferralShareTemplateUsage_storeId_createdAt_idx" ON "ReferralShareTemplateUsage"("storeId", "createdAt");\nCREATE INDEX "ReferralShareTemplateUsage_storeId_templateId_action_createdAt_idx" ON "ReferralShareTemplateUsage"("storeId", "templateId", "action", "createdAt");\n\nALTER TABLE "ReferralShareTemplateFavorite" ADD CONSTRAINT "ReferralShareTemplateFavorite_storeId_fkey" FOREIGN KEY ("storeId") REFERENCES "Store"("id") ON DELETE CASCADE ON UPDATE CASCADE;\nALTER TABLE "ReferralShareTemplateUsage" ADD CONSTRAINT "ReferralShareTemplateUsage_storeId_fkey" FOREIGN KEY ("storeId") REFERENCES "Store"("id") ON DELETE CASCADE ON UPDATE CASCADE;\n''')

          service = Path('src/server/services/referral-share-template-personalization.ts')
          service.parent.mkdir(parents=True, exist_ok=True)
          service.write_text('''import { prisma } from "@/lib/db";\nimport { OFFICIAL_REFERRAL_SHARE_TEMPLATES } from "@/lib/referral-share-official-templates";\nimport type { ReferralShareTemplateUsageAction } from "@prisma/client";\n\nconst officialTemplateIds = new Set(\n  OFFICIAL_REFERRAL_SHARE_TEMPLATES.map((item) => item.id),\n);\n\nexport function assertOfficialReferralTemplateId(templateId: string): void {\n  if (!officialTemplateIds.has(templateId)) {\n    throw new Error("UNKNOWN_REFERRAL_SHARE_TEMPLATE");\n  }\n}\n\nexport async function getReferralTemplatePersonalization(storeId: string) {\n  const [favorites, recent] = await Promise.all([\n    prisma.referralShareTemplateFavorite.findMany({\n      where: { storeId },\n      orderBy: { updatedAt: "desc" },\n      select: { templateId: true },\n    }),\n    prisma.referralShareTemplateUsage.findMany({\n      where: { storeId },\n      orderBy: { createdAt: "desc" },\n      take: 20,\n      select: { templateId: true, action: true, createdAt: true },\n    }),\n  ]);\n\n  return {\n    favoriteTemplateIds: favorites.map((item) => item.templateId),\n    recent,\n  };\n}\n\nexport async function setReferralTemplateFavorite(params: {\n  storeId: string;\n  templateId: string;\n  favorite: boolean;\n}) {\n  assertOfficialReferralTemplateId(params.templateId);\n  if (params.favorite) {\n    await prisma.referralShareTemplateFavorite.upsert({\n      where: {\n        storeId_templateId: {\n          storeId: params.storeId,\n          templateId: params.templateId,\n        },\n      },\n      create: { storeId: params.storeId, templateId: params.templateId },\n      update: {},\n    });\n  } else {\n    await prisma.referralShareTemplateFavorite.deleteMany({\n      where: { storeId: params.storeId, templateId: params.templateId },\n    });\n  }\n}\n\nexport async function recordReferralTemplateUsage(params: {\n  storeId: string;\n  templateId: string;\n  action: ReferralShareTemplateUsageAction;\n}) {\n  assertOfficialReferralTemplateId(params.templateId);\n  await prisma.referralShareTemplateUsage.create({ data: params });\n}\n''')

          actions = Path('src/server/actions/referral-share-template-personalization.ts')
          actions.write_text('''"use server";\n\nimport { z } from "zod";\nimport { handleActionError } from "@/lib/errors";\nimport { requirePermission } from "@/lib/permissions";\nimport { resolveWriteStoreId } from "@/lib/store";\nimport { revalidatePath } from "next/cache";\nimport {\n  getReferralTemplatePersonalization,\n  recordReferralTemplateUsage,\n  setReferralTemplateFavorite,\n} from "@/server/services/referral-share-template-personalization";\n\nconst templateIdSchema = z.string().min(1).max(120);\nconst favoriteSchema = z.object({\n  templateId: templateIdSchema,\n  favorite: z.boolean(),\n});\nconst usageSchema = z.object({\n  templateId: templateIdSchema,\n  action: z.enum(["PREVIEW", "APPLY", "SAVE"]),\n});\n\nasync function authenticatedStoreId() {\n  const user = await requirePermission("plans.edit");\n  return resolveWriteStoreId(user);\n}\n\nexport async function getReferralTemplatePersonalizationAction() {\n  try {\n    const storeId = await authenticatedStoreId();\n    return { success: true as const, data: await getReferralTemplatePersonalization(storeId) };\n  } catch (error) {\n    return handleActionError(error);\n  }\n}\n\nexport async function setReferralTemplateFavoriteAction(input: unknown) {\n  try {\n    const storeId = await authenticatedStoreId();\n    const data = favoriteSchema.parse(input);\n    await setReferralTemplateFavorite({ storeId, ...data });\n    revalidatePath("/dashboard/settings/referral-share");\n    return { success: true as const, data: undefined };\n  } catch (error) {\n    return handleActionError(error);\n  }\n}\n\nexport async function recordReferralTemplateUsageAction(input: unknown) {\n  try {\n    const storeId = await authenticatedStoreId();\n    const data = usageSchema.parse(input);\n    await recordReferralTemplateUsage({ storeId, ...data });\n    revalidatePath("/dashboard/settings/referral-share");\n    return { success: true as const, data: undefined };\n  } catch (error) {\n    return handleActionError(error);\n  }\n}\n''')

          test = Path('src/__tests__/referral-share-template-personalization.test.ts')
          test.write_text('''import { beforeEach, describe, expect, it, vi } from "vitest";\n\nconst favoriteUpsert = vi.fn();\nconst favoriteDeleteMany = vi.fn();\nconst favoriteFindMany = vi.fn();\nconst usageCreate = vi.fn();\nconst usageFindMany = vi.fn();\n\nvi.mock("@/lib/db", () => ({\n  prisma: {\n    referralShareTemplateFavorite: {\n      upsert: favoriteUpsert,\n      deleteMany: favoriteDeleteMany,\n      findMany: favoriteFindMany,\n    },\n    referralShareTemplateUsage: { create: usageCreate, findMany: usageFindMany },\n  },\n}));\n\nimport {\n  assertOfficialReferralTemplateId,\n  getReferralTemplatePersonalization,\n  recordReferralTemplateUsage,\n  setReferralTemplateFavorite,\n} from "@/server/services/referral-share-template-personalization";\n\ndescribe("referral template personalization", () => {\n  beforeEach(() => vi.clearAllMocks());\n\n  it("rejects unknown template ids before any database write", async () => {\n    expect(() => assertOfficialReferralTemplateId("not-official")).toThrow();\n    await expect(\n      setReferralTemplateFavorite({ storeId: "store-a", templateId: "not-official", favorite: true }),\n    ).rejects.toThrow();\n    expect(favoriteUpsert).not.toHaveBeenCalled();\n  });\n\n  it("scopes favorites to the authenticated store id supplied by the action layer", async () => {\n    await setReferralTemplateFavorite({\n      storeId: "store-a",\n      templateId: "featured-genuine-review",\n      favorite: true,\n    });\n    expect(favoriteUpsert).toHaveBeenCalledWith(\n      expect.objectContaining({\n        where: { storeId_templateId: { storeId: "store-a", templateId: "featured-genuine-review" } },\n      }),\n    );\n  });\n\n  it("records store-scoped usage and reads only that store", async () => {\n    favoriteFindMany.mockResolvedValue([{ templateId: "featured-genuine-review" }]);\n    usageFindMany.mockResolvedValue([]);\n    await recordReferralTemplateUsage({\n      storeId: "store-b",\n      templateId: "featured-genuine-review",\n      action: "APPLY",\n    });\n    expect(usageCreate).toHaveBeenCalledWith({\n      data: { storeId: "store-b", templateId: "featured-genuine-review", action: "APPLY" },\n    });\n    await getReferralTemplatePersonalization("store-b");\n    expect(favoriteFindMany).toHaveBeenCalledWith(expect.objectContaining({ where: { storeId: "store-b" } }));\n    expect(usageFindMany).toHaveBeenCalledWith(expect.objectContaining({ where: { storeId: "store-b" } }));\n  });\n});\n''')
          PY
          npx prisma format
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prisma/schema.prisma prisma/migrations/20260715_add_referral_template_favorites_usage/migration.sql src/server/services/referral-share-template-personalization.ts src/server/actions/referral-share-template-personalization.ts src/__tests__/referral-share-template-personalization.test.ts
          git commit -m 'Add referral template favorites and usage backend'
          git push