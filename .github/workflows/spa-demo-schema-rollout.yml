name: Apply SPA Demo schema rollout

on:
  workflow_dispatch:
  push:
    branches:
      - feat/spa-demo-store
    paths:
      - .github/spa-demo-schema-rollout-request.json

permissions:
  contents: read

concurrency:
  group: spa-demo-schema-production-rollout
  cancel-in-progress: false

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CONFIRMATION: APPLY_SPA_DEMO_SCHEMA_ROLLOUT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply approved additive schema and Demo-only seed
        run: node scripts/apply-spa-demo-schema-rollout.mjs
