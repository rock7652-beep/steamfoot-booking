name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint changed files, test, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      DIGITAL_BUTLER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint changed source files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JavaScript or TypeScript files to lint."
            exit 0
          fi
          printf 'Linting %s\n' "${files[@]}"
          npx eslint "${files[@]}"

      - name: Lint repository
        if: github.event_name != 'pull_request'
        run: npm run lint

      - name: Test
        shell: bash
        run: |
          npx vitest run --reporter=verbose > /tmp/vitest.log 2>&1

      - name: Upload Vitest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log
          path: /tmp/vitest.log
          if-no-files-found: error
          retention-days: 1

      - name: Typecheck
        run: npx tsc --noEmit
