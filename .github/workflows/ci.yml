name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-lint:
    name: Changed-file ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint changed source files
        shell: bash
        env:
          COURSE_RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "$COURSE_RELEASE_BRANCH" == "codex/course-scheduling-stage1" ]; then
            git fetch origin main
            base=$(git merge-base origin/main HEAD)
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            npm run lint
            exit 0
          else
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.js' '*.jsx' '*.ts' '*.tsx')
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JavaScript or TypeScript files to lint."
            exit 0
          fi
          printf 'Linting %s\n' "${files[@]}"
          npx eslint "${files[@]}"

  targeted-tests:
    name: Targeted tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DIGITAL_BUTLER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run targeted tests
        shell: bash
        run: |
          mapfile -t tests < <(find src -type f \( -name '*digital-butler*.test.ts' -o -name '*digital-butler*.test.tsx' \) | sort)
          tests+=(src/__tests__/reminder-send-result.test.ts)
          tests+=(src/__tests__/verified-reminder-line-route.test.ts)
          tests+=(src/__tests__/reminder-engine.test.ts)
          tests+=(src/__tests__/public-trial-line-customer.test.ts)
          tests+=(src/__tests__/public-trial-booking-placeholder-name.test.ts)
          tests+=(src/__tests__/liff-public-trial-entry-route.test.ts)
          tests+=(src/__tests__/trial-reminder-convergence-contract.test.ts)
          tests+=(src/__tests__/manager-notification-delivery.test.ts)
          tests+=(src/__tests__/manager-notification-settings.test.ts)
          tests+=(src/__tests__/line-manager-retry-key.test.ts)
          tests+=(src/__tests__/store-manager-line-notifications.test.ts)
          tests+=(src/__tests__/same-day-booking-manager-notification.test.ts)
          tests+=(src/__tests__/same-day-booking-reminder-settings.test.ts)
          tests+=(src/__tests__/session-balance-line-response.test.ts)
          tests+=(src/__tests__/staff-session-security.test.ts)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No targeted tests found."
            exit 0
          fi
          printf 'Testing %s\n' "${tests[@]}"
          npx vitest run "${tests[@]}"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

  full-vitest-baseline:
    name: Full Vitest baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      NODE_ENV: test
      DIGITAL_BUTLER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run full Vitest baseline
        run: npx vitest run
