name: Inventory returns isolated acceptance
on:
  push:
    branches: [feat/inventory-returns-20261007]
    paths:
      - 'src/__tests__/inventory-returns.pg.test.ts'
      - '.github/workflows/inventory-returns-audit.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: inventory_returns_test
        ports: [5432:5432]
        options: >-
          --health-cmd 'pg_isready -U postgres -d inventory_returns_test'
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/inventory_returns_test
      DIRECT_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/inventory_returns_test
      BOOKING_INTEGRATION_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/inventory_returns_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: >-
          npx vitest run --config vitest.pg.config.ts src/__tests__/inventory-returns.pg.test.ts
          --reporter=default --reporter=json --outputFile=inventory-returns-results.json
      - name: Require all three database tests without skips
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("inventory-returns-results.json", "utf8"));
            if (!r.success || r.numTotalTests !== 3 || r.numPassedTests !== 3 || r.numPendingTests !== 0)
              throw new Error("All three inventory database tests must pass without skips");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-returns-results
          path: inventory-returns-results.json
          retention-days: 7
