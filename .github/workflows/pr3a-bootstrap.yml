name: PR 3-A Bootstrap

on:
  push:
    branches:
      - codex/pr3a-referral-share-template-core

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.event.head_commit.message == 'chore: bootstrap PR 3-A implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply PR 3-A implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "prisma/schema.prisma",
              '  lineOfficialUrl       String? // LINE@ 連結，例：「https://lin.ee/UvRnFFK」\n',
              '  lineOfficialUrl       String? // LINE@ 連結，例：「https://lin.ee/UvRnFFK」\n'
              '  referralShareTemplate String? // 每店推薦分享模板；僅允許 {storeName} / {url}\n',
          )

          replace_once(
              "src/app/(customer)/book/page.tsx",
              '                referralUrl={shareContext.referralUrl}\n',
              '                referralUrl={shareContext.referralUrl}\n'
              '                shareTemplate={shareContext.shareTemplate}\n',
          )

          replace_once(
              "src/app/(customer)/my-referrals/page.tsx",
              '                referralUrl={shareContext.referralUrl}\n',
              '                referralUrl={shareContext.referralUrl}\n'
              '                shareTemplate={shareContext.shareTemplate}\n',
          )
          PY

          mkdir -p prisma/migrations/20260714_add_referral_share_template
          cat > prisma/migrations/20260714_add_referral_share_template/migration.sql <<'EOF'
          -- Add per-store referral share template. NULL keeps the system default.
          ALTER TABLE "ShopConfig"
          ADD COLUMN "referralShareTemplate" TEXT;
          EOF

          cat > src/lib/referral-share-template.ts <<'EOF'
          export const REFERRAL_SHARE_TEMPLATE_MAX_LENGTH = 2000;

          export const DEFAULT_REFERRAL_SHARE_TEMPLATE = [
            "我最近去「{storeName}」",
            "坐著45分鐘居然有點像慢跑完的感覺 😂",
            "而且蒸完真的很好睡",
            "",
            "📍{storeName}",
            "",
            "如果你最近也有點累",
            "可以去放鬆一下👇",
            "{url}",
            "",
            "現在還有體驗價$499",
            "想去趕快約喔",
          ].join("\n");

          const ALLOWED_VARIABLES = new Set(["storeName", "url"]);

          export class ReferralShareTemplateValidationError extends Error {
            constructor(message: string) {
              super(message);
              this.name = "ReferralShareTemplateValidationError";
            }
          }

          function validationError(message: string): never {
            throw new ReferralShareTemplateValidationError(message);
          }

          /**
           * Normalize and validate a merchant-authored referral template.
           * Empty input means “use system default” and is stored as NULL.
           */
          export function normalizeReferralShareTemplate(
            value: string | null | undefined,
          ): string | null {
            if (value == null) return null;

            const normalized = value.replace(/\r\n/g, "\n").trim();
            if (!normalized) return null;

            if (normalized.length > REFERRAL_SHARE_TEMPLATE_MAX_LENGTH) {
              validationError(
                `推薦分享文案不可超過 ${REFERRAL_SHARE_TEMPLATE_MAX_LENGTH} 個字元`,
              );
            }

            const variables = [...normalized.matchAll(/\{([^{}]+)\}/g)].map(
              (match) => match[1],
            );
            const unknown = variables.find((variable) => !ALLOWED_VARIABLES.has(variable));
            if (unknown) {
              validationError(`不支援變數 {${unknown}}，僅可使用 {storeName} 與 {url}`);
            }

            const textWithoutAllowedVariables = normalized.replace(
              /\{(?:storeName|url)\}/g,
              "",
            );
            if (/[{}]/.test(textWithoutAllowedVariables)) {
              validationError("變數格式錯誤，請使用 {storeName} 或 {url}");
            }

            const urlCount = normalized.match(/\{url\}/g)?.length ?? 0;
            if (urlCount !== 1) {
              validationError("推薦分享文案必須且只能包含一個 {url}");
            }

            return normalized;
          }

          /** Render safely; invalid persisted data fails back to the system template. */
          export function renderReferralShareTemplate(input: {
            template?: string | null;
            storeName: string;
            url: string;
          }): string {
            let template = DEFAULT_REFERRAL_SHARE_TEMPLATE;
            try {
              template =
                normalizeReferralShareTemplate(input.template) ??
                DEFAULT_REFERRAL_SHARE_TEMPLATE;
            } catch {
              template = DEFAULT_REFERRAL_SHARE_TEMPLATE;
            }

            return template
              .replaceAll("{storeName}", input.storeName)
              .replace("{url}", input.url);
          }
          EOF

          cat > src/lib/share.ts <<'EOF'
          /**
           * 全系統唯一分享核心
           *
           * 所有分享行為（複製連結、LINE 分享、文案組合）必須走這裡。
           * 禁止各頁自行拼接 URL 或 share text。
           */

          import {
            DEFAULT_REFERRAL_SHARE_TEMPLATE,
            renderReferralShareTemplate,
          } from "@/lib/referral-share-template";

          export { DEFAULT_REFERRAL_SHARE_TEMPLATE } from "@/lib/referral-share-template";

          export interface BuildShareTextOpts {
            /** 顧客所屬店家的正式名稱（Store.name） */
            storeName: string;
            /** 邀請人姓名（可選，保留給未來 A/B） */
            inviterName?: string | null;
            /** 店家自訂模板；null/空值使用系統預設 */
            template?: string | null;
            /** 已完成渲染的覆寫文字（舊呼叫點相容） */
            body?: string;
            /** 系統產生的店舖推薦入口（含 ref） */
            url: string;
          }

          /** 供 LINE 分享與複製使用，兩者輸出完全一致。 */
          export function buildShareText(opts: BuildShareTextOpts): string {
            if (opts.body) return opts.body;
            return renderReferralShareTemplate({
              template: opts.template,
              storeName: opts.storeName,
              url: opts.url,
            });
          }

          /** 組合推薦分享的完整 URL。 */
          export function buildReferralEntryUrl(
            storeSlug: string,
            code: string,
            origin?: string,
          ): string {
            const path = `/s/${storeSlug}/line-entry?ref=${encodeURIComponent(code)}`;
            if (!origin) return path;
            return `${origin.replace(/\/$/, "")}${path}`;
          }

          /** 向下相容別名；所有路徑都使用同一個安全入口。 */
          export const buildStoreLineEntryUrl = buildReferralEntryUrl;

          /** 分享 URL 已內嵌在 text 中間。 */
          export function buildLineShareUrl(text: string, _shareUrl?: string): string {
            return `https://line.me/R/share?text=${encodeURIComponent(text)}`;
          }

          /** 複製到剪貼簿（僅瀏覽器端可用）。 */
          export async function copyToClipboard(value: string): Promise<boolean> {
            if (typeof navigator === "undefined" || !navigator.clipboard) return false;
            try {
              await navigator.clipboard.writeText(value);
              return true;
            } catch {
              return false;
            }
          }

          /** 把相對連結補齊成絕對 URL（client-side 用）。 */
          export function toAbsoluteUrl(pathOrUrl: string): string {
            if (pathOrUrl.startsWith("http")) return pathOrUrl;
            if (typeof window === "undefined") return pathOrUrl;
            return `${window.location.origin}${pathOrUrl}`;
          }

          // Keep the named import referenced for source-level discoverability and backwards docs.
          void DEFAULT_REFERRAL_SHARE_TEMPLATE;
          EOF

          cat > src/server/queries/referral-share-context.ts <<'EOF'
          import { prisma } from "@/lib/db";
          import { normalizeLineOfficialUrl } from "@/lib/line-official-url";
          import { buildReferralEntryUrl } from "@/lib/share";

          export type ReferralShareContext =
            | {
                available: true;
                storeName: string;
                referralUrl: string;
                shareTemplate: string | null;
              }
            | {
                available: false;
                reason:
                  | "STORE_UNAVAILABLE"
                  | "LINE_NOT_CONFIGURED"
                  | "REFERRAL_CODE_MISSING";
              };

          /** 由 server 驗證顧客歸屬與店舖設定，client 不接觸 LINE 目的地。 */
          export async function getReferralShareContext(input: {
            customerId: string;
            storeId: string;
            storeSlug: string;
          }): Promise<ReferralShareContext> {
            const customer = await prisma.customer.findFirst({
              where: {
                id: input.customerId,
                storeId: input.storeId,
                mergedIntoCustomerId: null,
              },
              select: {
                id: true,
                referralCode: true,
                store: {
                  select: {
                    name: true,
                    slug: true,
                    operatingStatus: true,
                    shopConfig: {
                      select: {
                        lineOfficialUrl: true,
                        referralShareTemplate: true,
                      },
                    },
                  },
                },
              },
            });

            if (
              !customer ||
              customer.store.slug !== input.storeSlug ||
              !["TRIAL", "ACTIVE"].includes(customer.store.operatingStatus)
            ) {
              return { available: false, reason: "STORE_UNAVAILABLE" };
            }
            if (!normalizeLineOfficialUrl(customer.store.shopConfig?.lineOfficialUrl)) {
              return { available: false, reason: "LINE_NOT_CONFIGURED" };
            }

            return {
              available: true,
              storeName: customer.store.name,
              referralUrl: buildReferralEntryUrl(
                customer.store.slug,
                customer.referralCode ?? customer.id,
              ),
              shareTemplate: customer.store.shopConfig?.referralShareTemplate ?? null,
            };
          }
          EOF

