name: One-time recover one approved HealthFlow customer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-recover-ye-you-chi-health.yml

permissions:
  contents: read

concurrency:
  group: healthflow-native-history-production
  cancel-in-progress: false

jobs:
  recover:
    name: Audit, recover, and verify approved customer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      HEALTHFLOW_SUPABASE_URL: ${{ secrets.HEALTHFLOW_SUPABASE_URL }}
      HEALTHFLOW_SERVICE_ROLE_KEY: ${{ secrets.HEALTHFLOW_SERVICE_ROLE_KEY }}
      CUSTOMER_ID: cmomcpxap0001jy04n24ewviv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Read-only recovery audit
        id: audit
        run: >-
          npx tsx scripts/recover-healthflow-history-by-phone.ts
          --customer-id="$CUSTOMER_ID"
          --github-output="$GITHUB_OUTPUT"
      - name: Recover and transactionally verify approved plan
        if: steps.audit.outputs.pending_records != '0'
        run: >-
          npx tsx scripts/recover-healthflow-history-by-phone.ts
          --execute
          --confirm-unique-phone-recovery
          --customer-id="$CUSTOMER_ID"
          --expected-pending=${{ steps.audit.outputs.pending_records }}
          --expected-plan-sha256=${{ steps.audit.outputs.plan_digest }}
      - name: Verify no eligible records remain
        run: >-
          npx tsx scripts/recover-healthflow-history-by-phone.ts
          --customer-id="$CUSTOMER_ID"
          --expected-pending=0
