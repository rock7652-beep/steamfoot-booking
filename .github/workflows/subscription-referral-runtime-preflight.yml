name: Read-only subscription referral runtime preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type READ_ONLY_REFERRAL_PREFLIGHT (no installation or rewards)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: subscription-referral-runtime-preflight
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'READ_ONLY_REFERRAL_PREFLIGHT'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production – steamfoot-booking
    steps:
      - name: Retrieve only diagnostic files from the exact approved commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/referral-source.tar.gz"
          python3 - <<'PY'
          import os, tarfile
          from pathlib import Path
          required = {'package.json', 'package-lock.json',
            'scripts/subscription-referral-runtime-preflight.mjs',
            'scripts/qa/subscription-referral-runtime-preflight.test.mjs',
            'scripts/beauty-production-ca.mjs', 'scripts/certs/supabase-root-2021.crt'}
          with tarfile.open(Path(os.environ['RUNNER_TEMP']) / 'referral-source.tar.gz') as archive:
            for member in archive.getmembers():
              relative = member.name.partition('/')[2]
              if relative not in required:
                continue
              if not member.isfile() or member.size > 10_000_000:
                raise RuntimeError('Unexpected diagnostic source member')
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(archive.extractfile(member).read())
              required.remove(relative)
          if required:
            raise RuntimeError('Missing diagnostic source files')
          PY
          rm "$RUNNER_TEMP/referral-source.tar.gz"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify target guards and read-only control flow without credentials
        run: node --test scripts/qa/subscription-referral-runtime-preflight.test.mjs
      - name: Install isolated locked driver without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/referral-preflight"
          cp package.json package-lock.json "$RUNNER_TEMP/referral-preflight/"
          cp scripts/subscription-referral-runtime-preflight.mjs "$RUNNER_TEMP/referral-preflight/"
          cp scripts/beauty-production-ca.mjs "$RUNNER_TEMP/referral-preflight/"
          mkdir -p "$RUNNER_TEMP/referral-preflight/scripts/certs"
          cp scripts/certs/supabase-root-2021.crt "$RUNNER_TEMP/referral-preflight/scripts/certs/"
          cd "$RUNNER_TEMP/referral-preflight"
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Read catalog through existing protected connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PREFLIGHT_DIRECTORY: ${{ runner.temp }}/referral-preflight
        run: |
          cd "$PREFLIGHT_DIRECTORY"
          node subscription-referral-runtime-preflight.mjs --read-only
