name: Import approved HealthFlow safe matches

on:
  push:
    branches:
      - codex/healthflow-328-safe-audit
    paths:
      - .github/workflows/import-healthflow-approved-safe-matches.yml
      - scripts/import-healthflow-approved-safe-matches.ts
      - src/lib/healthflow-safe-reconciliation.ts

permissions:
  contents: read

concurrency:
  group: healthflow-native-history-production
  cancel-in-progress: false

jobs:
  import:
    name: Import and verify the approved five records
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      HEALTHFLOW_SUPABASE_URL: ${{ secrets.HEALTHFLOW_SUPABASE_URL }}
      HEALTHFLOW_SERVICE_ROLE_KEY: ${{ secrets.HEALTHFLOW_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in DATABASE_URL DIRECT_URL HEALTHFLOW_SUPABASE_URL HEALTHFLOW_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub production secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import only the approved five-record plan
        id: import
        run: >-
          npx tsx scripts/import-healthflow-approved-safe-matches.ts
          --execute
          --confirm-approved-safe-match-import
          --expected-pending=5
          --expected-plan-sha256=55e6271cb11915b0ad1e136141c0d4d1ff6551a13bf65b23704bf4133bcabdfe
          --expected-total-after=792
          --expected-remaining-after=316

      - name: Publish aggregate completion note
        if: success()
        run: |
          {
            echo "## HealthFlow 安全候選補入完成"
            echo
            echo "- 本次核准並驗證：5 筆"
            echo "- 蒸管家 HEALTHFLOW 總數：792 筆"
            echo "- 尚待人工處理：316 筆"
            echo
            echo "未修改顧客基本資料、LINE 綁定、方案或預約。"
          } >> "$GITHUB_STEP_SUMMARY"
