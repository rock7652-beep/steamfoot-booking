name: PR3A clean final diff

on:
  pull_request:
    branches:
      - main
    types: [reopened]

permissions:
  contents: write

jobs:
  clean-and-validate:
    if: github.head_ref == 'codex/pr3a-per-store-referral-share-template-core'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/steamfoot
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/steamfoot
      AUTH_SECRET: pr3a-test-secret
      NEXTAUTH_SECRET: pr3a-test-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore minimal Prisma diff
        shell: bash
        run: |
          git show origin/main:prisma/schema.prisma > prisma/schema.prisma
          python <<'PY'
          from pathlib import Path
          path = Path('prisma/schema.prisma')
          text = path.read_text()
          old = '  lineOfficialUrl       String? // LINE@ 連結，例：「https://lin.ee/UvRnFFK」\n'
          new = old + '  referralShareTemplate String? @db.Text // 每店推薦分享模板；null 時使用系統預設 fallback\n'
          if old not in text:
              raise SystemExit('ShopConfig insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed TypeScript only
        run: >-
          npx --yes prettier@3.3.3 --write
          src/lib/share.ts
          src/server/queries/referral-share-context.ts
          src/server/actions/referral-share-template.ts
          src/components/share-referral.tsx
          'src/app/(customer)/book/share-contact-actions.tsx'
          'src/app/(customer)/book/page.tsx'
          'src/app/(customer)/book/booking-form.tsx'
          'src/app/(customer)/my-referrals/page.tsx'
          src/__tests__/share-per-store.test.ts
          src/__tests__/referral-share-context.test.ts
          src/__tests__/referral-share-template-action.test.ts

      - name: Validate final tree
        run: |
          npx prisma validate
          npx vitest run src/__tests__/share-per-store.test.ts src/__tests__/referral-share-context.test.ts src/__tests__/referral-share-template-action.test.ts
          npx eslint src/lib/share.ts src/server/queries/referral-share-context.ts src/server/actions/referral-share-template.ts src/components/share-referral.tsx 'src/app/(customer)/book/share-contact-actions.tsx' 'src/app/(customer)/book/page.tsx' 'src/app/(customer)/book/booking-form.tsx' 'src/app/(customer)/my-referrals/page.tsx' src/__tests__/share-per-store.test.ts src/__tests__/referral-share-context.test.ts src/__tests__/referral-share-template-action.test.ts
          git diff --check
          npm run build

      - name: Commit cleaned implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma \
            src/lib/share.ts \
            src/server/queries/referral-share-context.ts \
            src/server/actions/referral-share-template.ts \
            src/components/share-referral.tsx \
            'src/app/(customer)/book/share-contact-actions.tsx' \
            'src/app/(customer)/book/page.tsx' \
            'src/app/(customer)/book/booking-form.tsx' \
            'src/app/(customer)/my-referrals/page.tsx' \
            src/__tests__/share-per-store.test.ts \
            src/__tests__/referral-share-context.test.ts \
            src/__tests__/referral-share-template-action.test.ts
          if git diff --cached --quiet; then
            echo "No cleanup changes needed"
            exit 0
          fi
          git commit -m "Clean PR 3-A implementation diff"
          git push origin HEAD:${{ github.head_ref }}
