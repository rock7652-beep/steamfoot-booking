name: Recover missing HealthFlow history by phone

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: Steamfoot customer ID; blank retains the legacy all-customer audit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: healthflow-native-history-production
  cancel-in-progress: false

jobs:
  recover:
    name: Audit, recover, and verify missing history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      HEALTHFLOW_SUPABASE_URL: ${{ secrets.HEALTHFLOW_SUPABASE_URL }}
      HEALTHFLOW_SERVICE_ROLE_KEY: ${{ secrets.HEALTHFLOW_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in DATABASE_URL DIRECT_URL HEALTHFLOW_SUPABASE_URL HEALTHFLOW_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub production secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Read-only recovery audit
        id: audit
        run: >-
          npx tsx scripts/recover-healthflow-history-by-phone.ts
          ${{ inputs.customer_id && format('--customer-id={0}', inputs.customer_id) || '' }}
          --github-output="$GITHUB_OUTPUT"

      - name: Recover and transactionally verify approved plan
        if: steps.audit.outputs.pending_records != '0'
        run: >-
          npx tsx scripts/recover-healthflow-history-by-phone.ts
          --execute
          --confirm-unique-phone-recovery
          ${{ inputs.customer_id && format('--customer-id={0}', inputs.customer_id) || '' }}
          --expected-pending=${{ steps.audit.outputs.pending_records }}
          --expected-plan-sha256=${{ steps.audit.outputs.plan_digest }}

      - name: Verify no eligible records remain
        run: >-
          npx tsx scripts/recover-healthflow-history-by-phone.ts
          ${{ inputs.customer_id && format('--customer-id={0}', inputs.customer_id) || '' }}
          --expected-pending=0
