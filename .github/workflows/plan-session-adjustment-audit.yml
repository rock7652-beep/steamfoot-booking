name: Plan session adjustment isolated PostgreSQL acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/**/session-adjustment.ts'
      - 'src/server/**/*session-adjustment*.ts'
      - 'src/lib/plan-session-adjustment.ts'
      - 'src/server/services/music-lesson-periods.ts'
      - 'src/server/beauty/command.ts'
      - 'src/__tests__/plan-session-adjustment.pg.test.ts'
      - '.github/workflows/plan-session-adjustment-audit.yml'
permissions:
  contents: read
jobs:
  session-adjustment-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: plan_session_adjustment_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d plan_session_adjustment_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/plan_session_adjustment_test
      DIRECT_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/plan_session_adjustment_test
      BOOKING_CONCURRENCY_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/plan_session_adjustment_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Actual module transactions and durable retry receipts
        run: >-
          npx vitest run src/__tests__/plan-session-adjustment.pg.test.ts
          --reporter=default --reporter=json --outputFile=plan-session-adjustment-pg-results.json
      - name: Require all scenarios without skips
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("plan-session-adjustment-pg-results.json", "utf8"));
            if (!r.success || r.numTotalTests !== 11 || r.numPassedTests !== 11 || r.numPendingTests !== 0)
              throw new Error("All eleven session adjustment PostgreSQL scenarios must pass without skips");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-session-adjustment-pg-results
          path: plan-session-adjustment-pg-results.json
          retention-days: 7
