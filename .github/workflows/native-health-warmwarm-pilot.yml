name: Native health warmwarm pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only audit or guarded single-store rollout
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      confirmation:
        description: For execute, enter ENABLE_WARMWARM_NATIVE_HEALTH
        required: false
        type: string
  push:
    branches:
      - codex/native-health-assessment
    paths:
      - .github/workflows/native-health-warmwarm-pilot.yml

permissions:
  contents: read

concurrency:
  group: native-health-warmwarm-production
  cancel-in-progress: false

jobs:
  pilot:
    name: ${{ inputs.mode || 'dry-run' }} warmwarm native health pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Validate execute confirmation
        if: inputs.mode == 'execute'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "ENABLE_WARMWARM_NATIVE_HEALTH" ]; then
            echo "Execution confirmation did not match."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Validate production records and feature state
        run: npx tsx scripts/native-health-pilot.ts
      - name: Enable warmwarm only and verify
        if: inputs.mode == 'execute'
        run: npx tsx scripts/native-health-pilot.ts --execute --confirm-warmwarm-pilot
