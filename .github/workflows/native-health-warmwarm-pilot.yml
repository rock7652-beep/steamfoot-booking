name: Native health warmwarm pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only audit or guarded single-store rollout
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      confirmation:
        description: For execute, enter ENABLE_WARMWARM_NATIVE_HEALTH
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-health-warmwarm-pilot.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: native-health-warmwarm-production
  cancel-in-progress: false

jobs:
  pilot:
    name: ${{ inputs.mode || 'dry-run' }} warmwarm native health pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate execute confirmation
        if: inputs.mode == 'execute'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "ENABLE_WARMWARM_NATIVE_HEALTH" ]; then
            echo "Execution confirmation did not match."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Validate production records and feature state
        run: npx tsx scripts/native-health-pilot.ts | tee pilot-output.txt
      - name: Enable warmwarm only and verify
        if: inputs.mode == 'execute'
        run: npx tsx scripts/native-health-pilot.ts --execute --confirm-warmwarm-pilot | tee pilot-execute-output.txt
      - name: Publish redacted audit result
        if: always()
        shell: bash
        run: |
          {
            echo "## 暖暖原生健康單店驗收"
            echo
            echo "Run: ${{ github.run_id }}"
            echo
            echo '~~~json'
            if [ -f pilot-execute-output.txt ]; then
              cat pilot-execute-output.txt
            elif [ -f pilot-output.txt ]; then
              cat pilot-output.txt
            else
              echo '{"result":"workflow_failed_before_audit"}'
            fi
            echo '~~~'
          } > pilot-comment.md
          gh api repos/${{ github.repository }}/issues/770/comments -F body=@pilot-comment.md
