name: One-time private phone login diagnostic
on:
  push:
    branches: [main]
    paths: [.github/phone-login-diagnostic-request.json]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - name: Enforce read-only
        run: |
          ! grep -En 'prisma\..*\.(create|update|upsert|delete)' scripts/one-time-phone-login-diagnostic.ts
      - run: npx tsx scripts/one-time-phone-login-diagnostic.ts
      - uses: actions/upload-artifact@v4
        with:
          name: private-phone-login-diagnostic
          path: phone-login-diagnostic.json
          retention-days: 1
