name: Implement PR 3-A

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr3a-implementation
  cancel-in-progress: true

jobs:
  implement-and-validate:
    if: github.event.pull_request.head.ref == 'codex/pr3a-referral-share-template-core'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/pr3a-referral-share-template-core
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract and apply implementation script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr3a-bootstrap.yml').read_text().splitlines()
          apply_step = workflow.index('      - name: Apply PR 3-A implementation')
          run_line = workflow.index('        run: |', apply_step)
          end = workflow.index('      - name: Install dependencies', run_line)
          body = workflow[run_line + 1:end]
          script = ['set -euo pipefail']
          for line in body:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/pr3a-apply.sh').write_text('\n'.join(script) + '\n')
          PY
          bash /tmp/pr3a-apply.sh

      - name: Install dependencies
        run: npm ci

      - name: Format Prisma schema
        run: npx prisma format

      - name: Run targeted tests
        run: >-
          npx vitest run
          src/__tests__/referral-share-template.test.ts
          src/__tests__/referral-share-template-action.test.ts
          src/__tests__/referral-share-action.test.ts
          src/__tests__/referral-event-store-consistency.test.ts

      - name: Run targeted ESLint
        run: >-
          npx eslint
          src/lib/referral-share-template.ts
          src/lib/share.ts
          src/server/queries/referral-share-context.ts
          src/server/actions/referral-share-template.ts
          src/components/share-referral.tsx
          "src/app/(customer)/book/share-contact-actions.tsx"
          "src/app/(customer)/book/page.tsx"
          "src/app/(customer)/my-referrals/page.tsx"
          src/__tests__/referral-share-template.test.ts
          src/__tests__/referral-share-template-action.test.ts

      - name: Check diff whitespace
        run: git diff --check

      - name: Build application
        run: npm run build

      - name: Commit implementation and remove temporary automation
        shell: bash
        run: |
          rm -f \
            .github/workflows/pr3a-bootstrap.yml \
            .github/workflows/pr3a-pr-trigger.yml \
            .github/pr3a-bootstrap-trigger \
            .github/pr3a-bootstrap-trigger-2
          git config user.name "rock7652-beep"
          git config user.email "rock7652@gmail.com"
          git add -A
          git commit -m "Add per-store referral share template core"
          git push origin HEAD:codex/pr3a-referral-share-template-core
