name: PR 3-B fix settings type

on:
  push:
    branches:
      - codex/pr3b-referral-share-settings-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr3b-referral-share-settings-ui
      - name: Fix settings summary type guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/(dashboard)/dashboard/settings/page.tsx')
          s = p.read_text()
          old = 'value: shopConfig.referralShareTemplate ? ('
          new = 'value: "referralShareTemplate" in shopConfig && shopConfig.referralShareTemplate ? ('
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/app/(dashboard)/dashboard/settings/page.tsx'
          git commit -m 'Fix referral share status type guard'
          git push
