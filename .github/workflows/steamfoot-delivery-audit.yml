name: Steamfoot delivery isolated audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/services/session-balance-notifications.ts'
      - 'src/__tests__/session-balance-delivery.pg.test.ts'
      - 'prisma/migrations/20260927154000_session_balance_delivery/**'
      - '.github/workflows/steamfoot-delivery-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: steamfoot_delivery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d steamfoot_delivery_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/steamfoot_delivery_test
      DIRECT_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/steamfoot_delivery_test
      BOOKING_CONCURRENCY_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/steamfoot_delivery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create disposable schema (no production credentials)
        run: npx prisma db push --skip-generate
      - name: Exercise actual migration and dispatcher with mocked LINE
        run: npx vitest run src/__tests__/session-balance-delivery.pg.test.ts --reporter=default --reporter=json --outputFile=delivery-pg-results.json
      - name: Require all database tests, without skips
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("delivery-pg-results.json", "utf8"));
            if (!r.success || r.numTotalTests !== 8 || r.numPassedTests !== 8 || r.numPendingTests !== 0) {
              throw new Error("All eight delivery database tests must pass without skips");
            }
          '
