name: PR 3-C1 implementation

on:
  push:
    branches:
      - codex/pr3c1-official-referral-template-center

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr3c1-official-referral-template-center
      - name: Wire template center and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/(dashboard)/dashboard/settings/referral-share/referral-share-form.tsx')
          text = path.read_text()

          import_anchor = 'import { toast } from "sonner";\n'
          if 'ReferralTemplateCenter' not in text:
              text = text.replace(import_anchor, import_anchor + 'import { ReferralTemplateCenter } from "./referral-template-center";\n')

          text = re.sub(
              r'\nexport const REFERRAL_SHARE_EXAMPLES = \[.*?\n\] as const;\n',
              '\n',
              text,
              flags=re.S,
          )

          text = text.replace(
              '  function applyExample(exampleTemplate: string) {\n    setTemplate(exampleTemplate);\n    setUsesDefault(false);\n  }',
              '  function applyOfficialTemplate(exampleTemplate: string) {\n    setTemplate(exampleTemplate);\n    setUsesDefault(false);\n  }',
          )

          old = re.compile(r'''        <div className="mb-4 rounded-lg border border-earth-200 bg-earth-50/60 p-3">.*?        </div>\n\n        <label''', re.S)
          replacement = '''        <ReferralTemplateCenter\n          storeName={storeName}\n          previewUrl={previewUrl}\n          onApply={(item) => applyOfficialTemplate(item.content)}\n        />\n\n        <label'''
          text, count = old.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('template example block not found')
          path.write_text(text)

          test = Path('src/__tests__/referral-share-template-center.test.ts')
          test.write_text('''import { describe, expect, it } from "vitest";\nimport {\n  OFFICIAL_REFERRAL_SHARE_TEMPLATES,\n  REFERRAL_SHARE_TEMPLATE_CATEGORIES,\n} from "@/lib/referral-share-official-templates";\nimport { normalizeReferralShareTemplate } from "@/lib/referral-share-template";\n\ndescribe("official referral share template center", () => {\n  it("ships a useful MVP catalog across every category", () => {\n    expect(OFFICIAL_REFERRAL_SHARE_TEMPLATES.length).toBeGreaterThanOrEqual(20);\n    for (const category of ["FEATURED", "INDUSTRY", "OCCASION", "SEASONAL"] as const) {\n      expect(OFFICIAL_REFERRAL_SHARE_TEMPLATES.some((item) => item.category === category)).toBe(true);\n    }\n    expect(REFERRAL_SHARE_TEMPLATE_CATEGORIES[0]).toEqual({ key: "ALL", label: "全部" });\n  });\n\n  it("uses stable unique ids", () => {\n    const ids = OFFICIAL_REFERRAL_SHARE_TEMPLATES.map((item) => item.id);\n    expect(new Set(ids).size).toBe(ids.length);\n  });\n\n  it("keeps every official template compatible with backend validation", () => {\n    for (const item of OFFICIAL_REFERRAL_SHARE_TEMPLATES) {\n      expect(() => normalizeReferralShareTemplate(item.content), item.id).not.toThrow();\n      expect(item.content.match(/\\{url\\}/g)).toHaveLength(1);\n    }\n  });\n});\n''')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/'(dashboard)'/dashboard/settings/referral-share/referral-share-form.tsx src/__tests__/referral-share-template-center.test.ts
          git commit -m 'Build official referral share template center MVP'
          git push
