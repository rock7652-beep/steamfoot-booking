name: Recover HealthFlow history by secondary identity

on:
  push:
    branches: [main]
    paths:
      - scripts/recover-healthflow-history-by-secondary-identity.ts
      - src/lib/healthflow-secondary-recovery.ts
      - .github/workflows/recover-healthflow-history-by-secondary-identity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthflow-native-history-production
  cancel-in-progress: false

jobs:
  recover:
    name: Audit, recover unique matches, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      HEALTHFLOW_SUPABASE_URL: ${{ secrets.HEALTHFLOW_SUPABASE_URL }}
      HEALTHFLOW_SERVICE_ROLE_KEY: ${{ secrets.HEALTHFLOW_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in DATABASE_URL DIRECT_URL HEALTHFLOW_SUPABASE_URL HEALTHFLOW_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub production secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Read-only secondary-identity audit
        id: audit
        run: >-
          npx tsx scripts/recover-healthflow-history-by-secondary-identity.ts
          --github-output="$GITHUB_OUTPUT"
      - name: Recover and transactionally verify approved plan
        if: steps.audit.outputs.pending_records != '0'
        run: >-
          npx tsx scripts/recover-healthflow-history-by-secondary-identity.ts
          --execute
          --confirm-secondary-identity-recovery
          --expected-pending=${{ steps.audit.outputs.pending_records }}
          --expected-plan-sha256=${{ steps.audit.outputs.plan_digest }}
      - name: Verify no eligible records remain
        run: >-
          npx tsx scripts/recover-healthflow-history-by-secondary-identity.ts
          --expected-pending=0
