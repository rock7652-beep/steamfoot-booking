name: One-time second-stage LIFF login audit

on:
  push:
    branches: [main]
    paths: [.github/second-stage-liff-login-audit-request.json]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SECOND_STAGE_LIFF_AUDIT_REPORT_PATH: second-stage-liff-audit.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Verify audit is read-only
        run: |
          if grep -En 'prisma\..*\.(create|createMany|update|updateMany|upsert|delete|deleteMany)\(' scripts/audit-second-stage-liff-login-repairs.ts; then
            echo "Write operation detected; refusing to run."
            exit 1
          fi
      - run: npx tsx scripts/audit-second-stage-liff-login-repairs.ts
      - uses: actions/upload-artifact@v4
        with:
          name: second-stage-liff-login-audit-report
          path: second-stage-liff-audit.json
          retention-days: 1
          if-no-files-found: error
