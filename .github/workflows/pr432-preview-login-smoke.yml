name: PR 432 preview login smoke

on:
  push:
    branches:
      - codex/p0-recover-stale-customer-session
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview-login-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Execute stale-session login smoke
        env:
          BASE_URL: https://steamfoot-booking-git-codex-p0-r-1726d1-rock7652-2111s-projects.vercel.app
          SHARE_TOKEN: GTZnACH9OfAjTVcnMGbm2can4s20cOAl
          TEST_EMAIL: pr432-session-recovery@example.test
          TEST_PASSWORD: TempP0Test432!
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee smoke.log
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const documents = [];
            page.on('response', r => {
              if (r.request().resourceType() === 'document') {
                documents.push({ url: r.url(), status: r.status() });
              }
            });
            const start = `${process.env.BASE_URL}/hq/login?store=zhubei&_vercel_share=${process.env.SHARE_TOKEN}`;
            await page.goto(start, { waitUntil: 'networkidle', timeout: 120000 });
            await page.locator('#email').fill(process.env.TEST_EMAIL);
            await page.locator('#password').fill(process.env.TEST_PASSWORD);
            await page.locator('button[type="submit"]').click();
            await page.waitForURL('**/s/zhubei/book**', { timeout: 120000 });
            await page.waitForLoadState('networkidle');
            await page.waitForTimeout(8000);
            const finalUrl = page.url();
            const body = await page.locator('body').innerText();
            const bookDocuments = documents.filter(x => new URL(x.url).pathname === '/s/zhubei/book');
            const redirects = documents.filter(x => x.status >= 300 && x.status < 400);
            console.log('SMOKE_RESULT', JSON.stringify({ finalUrl, documents, bookDocuments, redirects, bodySnippet: body.slice(0,700) }, null, 2));
            if (!finalUrl.includes('/s/zhubei/book')) throw new Error(`unexpected final URL: ${finalUrl}`);
            if (!body.includes('立即預約')) throw new Error('booking home did not render');
            if (bookDocuments.length > 1) throw new Error(`unexpected booking document navigations: ${bookDocuments.length}`);
            if (redirects.length > 2) throw new Error(`possible redirect loop: ${redirects.length} document redirects`);
            await browser.close();
          })().catch(err => { console.error('SMOKE_ERROR', err); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr432-login-smoke-diagnostics
          path: smoke.log
          if-no-files-found: warn