name: PR 3-C1 validation

on:
  push:
    branches:
      - codex/pr3c1-official-referral-template-center

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run validation and record result
        shell: bash
        run: |
          set +e
          overall=0
          result_file="$RUNNER_TEMP/pr3c1-validation.env"
          : > "$result_file"

          run_check() {
            key="$1"
            shift
            echo "::group::$key"
            "$@"
            code=$?
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              status="PASS"
            else
              status="FAIL"
              overall=1
            fi
            printf '%s=%s\n' "$key" "$status" >> "$result_file"
          }

          run_check targeted_vitest npx vitest run \
            src/__tests__/referral-share-template-center.test.ts \
            src/__tests__/referral-share-settings-ui.test.ts \
            src/__tests__/referral-share-template.test.ts \
            src/__tests__/referral-share-template-action.test.ts

          run_check targeted_eslint npx eslint \
            'src/app/(dashboard)/dashboard/settings/referral-share/referral-share-form.tsx' \
            'src/app/(dashboard)/dashboard/settings/referral-share/referral-template-center.tsx' \
            src/lib/referral-share-official-templates.ts \
            src/__tests__/referral-share-template-center.test.ts

          run_check diff_check git diff --check origin/main...HEAD
          run_check full_build npm run build

          source "$result_file"
          cat > .github/pr3c1-validation-result.md <<EOF
          # PR 3-C1 validation result

          - Tested commit: \`$GITHUB_SHA\`
          - Targeted Vitest: **$targeted_vitest**
          - Targeted ESLint: **$targeted_eslint**
          - git diff --check: **$diff_check**
          - Full npm run build: **$full_build**
          EOF

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr3c1-validation-result.md
          git commit -m 'ci: record PR 3-C1 validation result [skip ci]' || true
          git push

          exit "$overall"
