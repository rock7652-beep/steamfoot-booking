name: One-time LIFF identity migration preview
on:
  push:
    branches: [main]
    paths: [.github/liff-identity-migration-preview-request.json]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production – steamfoot-booking
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: Enforce read-only contract
        run: |
          ! grep -En 'prisma\..*\.(create|createMany|update|updateMany|upsert|delete|deleteMany)' scripts/preview-liff-identity-migration.ts
          ! grep -En '\$executeRaw|\$queryRawUnsafe|\$executeRawUnsafe' scripts/preview-liff-identity-migration.ts
      - run: npx tsx scripts/preview-liff-identity-migration.ts
