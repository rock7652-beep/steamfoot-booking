name: Music makeup isolated database audit
on:
  pull_request:
    branches: ['main']
    paths:
      - 'src/server/services/course-booking.ts'
      - 'src/server/services/course-store-lock.ts'
      - 'src/server/actions/course-members.ts'
      - 'src/lib/music-opening-*.ts'
      - 'src/lib/course-card-expiry.ts'
      - 'src/server/queries/course-card-expiry-sql.ts'
      - 'src/server/services/music-opening-*.ts'
      - 'src/server/queries/music-opening-makeup.ts'
      - 'src/server/actions/music-opening-makeup.ts'
      - 'src/__tests__/music-opening-*.test.ts'
      - 'src/__tests__/course-card-expiry*.test.ts'
      - 'src/__tests__/course-customer-page.pg.test.ts'
      - 'src/server/queries/course-customer-page.ts'
      - 'src/__tests__/fixtures/music-opening*.ts'
      - 'docs/sql/music-opening-*.sql'
      - 'course-prisma/schema.prisma'
      - 'src/server/actions/course-booking-notification.ts'
      - 'src/__tests__/course-booking-notification.pg.test.ts'
      - 'src/__tests__/course-student-makeup.pg.test.ts'
      - 'src/__tests__/helpers/booking-concurrency-test-db.ts'
      - 'src/__tests__/helpers/audit-outbox-test-schema.ts'
      - 'supabase/migrations/20260928101128_course_student_makeup_link.sql'
      - 'supabase/migrations/20261002093141_course_coach_notifications.sql'
      - 'prisma/migrations/20260929140000_course_staff_person_link/migration.sql'
      - 'prisma/migrations/20260925191000_course_music_absence/migration.sql'
      - 'prisma/migrations/20261001093000_course_teacher_absence_refund/migration.sql'
      - 'prisma/migrations/20261007002000_verified_audit_actor/migration.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/music-makeup-audit.yml'
  push:
    branches: ['feat/music-opening-state-20261007']
    paths:
      - 'src/server/services/course-booking.ts'
      - 'src/server/services/course-store-lock.ts'
      - 'src/server/actions/course-members.ts'
      - 'src/lib/music-opening-*.ts'
      - 'src/lib/course-card-expiry.ts'
      - 'src/server/queries/course-card-expiry-sql.ts'
      - 'src/server/services/music-opening-*.ts'
      - 'src/server/queries/music-opening-makeup.ts'
      - 'src/server/actions/music-opening-makeup.ts'
      - 'src/__tests__/music-opening-*.test.ts'
      - 'src/__tests__/course-card-expiry*.test.ts'
      - 'src/__tests__/course-customer-page.pg.test.ts'
      - 'src/server/queries/course-customer-page.ts'
      - 'src/__tests__/fixtures/music-opening*.ts'
      - 'docs/sql/music-opening-*.sql'
      - 'course-prisma/schema.prisma'
      - 'src/server/actions/course-booking-notification.ts'
      - 'src/__tests__/course-booking-notification.pg.test.ts'
      - 'src/__tests__/course-student-makeup.pg.test.ts'
      - 'src/__tests__/helpers/booking-concurrency-test-db.ts'
      - 'src/__tests__/helpers/audit-outbox-test-schema.ts'
      - 'supabase/migrations/20260928101128_course_student_makeup_link.sql'
      - 'supabase/migrations/20261002093141_course_coach_notifications.sql'
      - 'prisma/migrations/20260929140000_course_staff_person_link/migration.sql'
      - 'prisma/migrations/20260925191000_course_music_absence/migration.sql'
      - 'prisma/migrations/20261001093000_course_teacher_absence_refund/migration.sql'
      - 'prisma/migrations/20261007002000_verified_audit_actor/migration.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/music-makeup-audit.yml'
permissions:
  contents: read
jobs:
  music-makeup-postgres:
    if: github.repository == 'rock7652-beep/steamfoot-booking' && (github.event_name != 'push' || github.ref == 'refs/heads/feat/music-opening-state-20261007')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: music_makeup_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d music_makeup_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/music_makeup_test
      DIRECT_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/music_makeup_test
      BOOKING_CONCURRENCY_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/music_makeup_test
    steps:
      - name: Checkout exact public commit without credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin https://github.com/rock7652-beep/steamfoot-booking.git
          git -c credential.helper= -c http.extraheader= fetch --no-tags --no-recurse-submodules --depth=1 origin "$EXPECTED_SHA"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise makeup reservation, attendance, cancellation, concurrency and isolation
        run: npx vitest run src/__tests__/course-student-makeup.pg.test.ts --reporter=default --reporter=json --outputFile=music-makeup-pg-results.json
      - name: Require all four database tests without skips
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("music-makeup-pg-results.json", "utf8"));
            if (!r.success || r.numTotalTests !== 4 || r.numPassedTests !== 4 || r.numPendingTests !== 0) throw new Error("All four makeup database scenarios must pass without skips");
          '
      - name: Exercise notification rescheduling and rollback against PostgreSQL
        run: npx vitest run src/__tests__/course-booking-notification.pg.test.ts --reporter=default --reporter=json --outputFile=course-notification-pg-results.json
      - name: Require all six notification database tests without skips
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("course-notification-pg-results.json", "utf8"));
            if (!r.success || r.numTotalTests !== 6 || r.numPassedTests !== 6 || r.numPendingTests !== 0) throw new Error("All six notification database scenarios must pass without skips");
          '
      - name: Exercise opening attendance, teacher changes and notification rollback against PostgreSQL
        run: npx vitest run src/__tests__/music-opening-transactions.pg.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=music-opening-pg-results.json
      - name: Require all eight opening database tests without skips
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("music-opening-pg-results.json", "utf8"));
            if (!r.success || r.numTotalTests !== 8 || r.numPassedTests !== 8 || r.numPendingTests !== 0) throw new Error("All eight opening database scenarios must pass without skips");
          '
      - name: Exercise opening make-up entitlement transactions and races
        run: npx vitest run src/__tests__/music-opening-makeup-transactions.pg.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=music-opening-makeup-pg-results.json
      - name: Require opening entitlement service scenarios without skips
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("music-opening-makeup-pg-results.json", "utf8"));
            if (!r.success || r.numTotalTests !== 12 || r.numPassedTests !== r.numTotalTests || r.numPendingTests !== 0) throw new Error("All opening entitlement database scenarios must pass without skips");
          '
      - name: Exercise verified opening imports, replay, real overlaps and atomic rollback
        run: npx vitest run src/__tests__/music-opening-import-transactions.pg.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=music-opening-import-pg-results.json
      - name: Require all nineteen combined importer database scenarios without skips
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("music-opening-import-pg-results.json", "utf8"));
            if (!r.success || r.numTotalTests !== 19 || r.numPassedTests !== 19 || r.numPendingTests !== 0) throw new Error("All nineteen combined importer PostgreSQL scenarios must pass without skips");
          '
      - name: Exercise nullable customer balance aggregation against PostgreSQL
        run: npx vitest run src/__tests__/course-customer-page.pg.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=music-no-expiry-report-pg-results.json
      - name: Require all five report database scenarios without skips
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("music-no-expiry-report-pg-results.json", "utf8"));
            if (!r.success || r.numTotalTests !== 5 || r.numPassedTests !== 5 || r.numPendingTests !== 0) throw new Error("All five nullable report PostgreSQL scenarios must pass without skips");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-makeup-pg-results
          path: |
            music-makeup-pg-results.json
            course-notification-pg-results.json
            music-opening-pg-results.json
            music-opening-makeup-pg-results.json
            music-opening-import-pg-results.json
            music-no-expiry-report-pg-results.json
          retention-days: 7
