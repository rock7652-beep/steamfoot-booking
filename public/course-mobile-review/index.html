<script>let role=new URLSearchParams(location.search).get('role')==='coach'?'coach':'member';const grid=document.querySelector('#grid');function render(){let cols=role==='member'?[['reference','原稿依據・操作結構整理','07:52 月曆標記＋08:04 同堂分列。原 HTML 未取回，以下是依已載入畫面整理的示意，不是原檔，也不作像素還原證據。'],['current','目前版・同情境轉錄','按 b4fc7cbb 元件結構轉錄，沿用高月曆、下方模式切換與展開歷史；非真實帳號畫面。'],['revised','修正版・待你確認','模式上移、緊湊月曆、逐人操作；完成／未到與取消各自收合。']]:[['current','教練目前版・同情境轉錄','高月曆、三種摘要數字、桌機側欄操作結構。'],['revised','教練修正版・待你確認','教練原稿未找到；依已確認需求整理。課程原位展開名單，日期與位置保留。']];grid.innerHTML=cols.map(([v,t,n])=>`<section class="col" style="width:${document.querySelector('#width').value}px"><h2>${t}</h2><p class="note">${n}</p><iframe title="${t}" src="demo.html?version=${v}&role=${role}"></iframe><small><a href="demo.html?version=${v}&role=${role}" target="_blank">獨立開啟此示意</a></small></section>`).join('');document.querySelector('#member').setAttribute('aria-pressed',role==='member');document.querySelector('#coach').setAttribute('aria-pressed',role==='coach')}document.querySelector('#member').onclick=()=>{role='member';render()};document.querySelector('#coach').onclick=()=>{role='coach';render()};document.querySelector('#width').onchange=render;document.querySelector('#reset').onclick=render;render();</script></html>
